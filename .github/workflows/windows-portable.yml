name: Compilar portable Windows (vista previa)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-portable.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar dependencias
        run: npm install --no-audit
      - name: Comprobar SQLite nativo antes de reconstrucción Electron
        run: node -e "const Database=require('better-sqlite3');const db=new Database(':memory:');db.prepare('SELECT 1').get();db.close()"
      - name: Probar bandeja SQLite y recepción de calificaciones
        run: node --test tests/submissions-sqlite.test.cjs
      - name: Probar lectura de notas de los cinco motores HTML
        run: node --test tests/grade-capture.test.cjs
      - name: Reconstruir SQLite para Electron
        run: npx electron-builder install-app-deps
      - name: Validar integración de bloqueo por actividad
        run: |
          node --check src/activity-preload.cjs
          node --check src/activity-permissions.cjs
          node --check src/main.cjs
          node --check src/grade-capture.cjs
          node --check src/ui/app.js
      - name: Pruebas
        run: npm test
      - name: Compilar portable
        run: npm run build:win
      - name: Publicar como artefacto de pruebas (no release)
        uses: actions/upload-artifact@v4
        with:
          name: EPE-FP360-Portable-PREVIEW-SIN-CONTENIDOS
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
